[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-manager"
version = "0.2.0"
description = "CLI Python pour générer des fiches Markdown structurées dans un portfolio"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "T. Konate", email = "ti.konate@proton.me"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
portfolio-manager = "portfolio_manager:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
