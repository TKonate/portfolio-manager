[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-manager"
version = "1.0.1"
description = "Dependency-free CLI and local web UI for a structured Markdown portfolio"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "T. Konate", email = "ti.konate@proton.me" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
portfolio-manager = "pfm.cli:main"
pfm = "pfm.cli:main"

[project.urls]
Homepage = "https://github.com/TKonate/portfolio-manager"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfm*"]

[tool.setuptools.package-data]
pfm = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
packages = ["pfm"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["pfm"]
omit = ["pfm/__main__.py"]
